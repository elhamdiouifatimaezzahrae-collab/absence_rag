[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-tag"
version = "0.0.1"
description = "Aide à l'allocation de la main-d'œuvre en confection (remplacement des ouvriers absents)"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2,<3.3",
    "openpyxl>=3.1,<3.2",
    "networkx>=3.4,<3.5",
    "fastapi>=0.115,<0.116",
    "uvicorn>=0.32,<0.33",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.28,<0.29"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "db: nécessite une base PostgreSQL de TEST",
]
