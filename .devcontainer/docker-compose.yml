# Conteneurs du Codespace Agent TAG (démonstration TEST).
# - app : poste de travail Python ; il partage le réseau de « db », PostgreSQL y est donc sur
#   localhost:5432.
# - db  : PostgreSQL 16. Aucun port n'est publié : la base n'est joignable que depuis le Codespace.
# Mots de passe : valeurs de TEST publiques (voir docker/init), jamais en production.
services:
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.13-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    network_mode: service:db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pg_admin_test
    volumes:
      - agent-tag-pgdata:/var/lib/postgresql/data
      - ../docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 20

volumes:
  agent-tag-pgdata:
